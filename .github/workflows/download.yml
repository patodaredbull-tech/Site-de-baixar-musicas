name: Download Music

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL (video ou playlist)'
        required: true
        type: string
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Detect type
        id: type
        run: |
          URL="${{ inputs.youtube_url }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          if echo "$URL" | grep -qE '(\?|&)list='; then
            echo "mode=playlist" >> $GITHUB_OUTPUT
          else
            echo "mode=single" >> $GITHUB_OUTPUT
          fi

      - name: Download
        run: |
          yt-dlp \
            --newline \
            -x --audio-format mp3 --audio-quality 0 \
            --embed-metadata --no-progress \
            -o "%(id)s_%(title)s.%(ext)s" \
            "${{ inputs.youtube_url }}"
        shell: bash

      - name: List downloaded files
        run: |
          echo "### Arquivos baixados"
          ls -lh *.mp3 2>/dev/null || echo "(nenhum)"

      - name: Commit & push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Add all new mp3s
          git add *.mp3 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No_files_to_commit"
          else
            git commit -m "Add music: ${{ inputs.youtube_url }}"
            git push
            echo "Pushed"
          fi
