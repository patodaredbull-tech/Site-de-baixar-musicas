name: Download Music

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube URL (video or playlist)'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Get playlist info
        id: playlist
        run: |
          URL="${{ inputs.youtube_url }}"
          if echo "$URL" | grep -q "list="; then
            echo "type=playlist" >> $GITHUB_OUTPUT
            echo "url=$URL" >> $GITHUB_OUTPUT
          else
            echo "type=single" >> $GITHUB_OUTPUT
            echo "url=$URL" >> $GITHUB_OUTPUT
          fi

      - name: Download single video
        if: steps.playlist.outputs.type == 'single'
        run: |
          yt-dlp \
            --no-playlist \
            -x --audio-format mp3 --audio-quality 0 \
            --embed-metadata \
            --no-progress \
            -o "%(id)s_%(title)s.%(ext)s" \
            "${{ inputs.youtube_url }}"
        shell: bash

      - name: Download playlist
        if: steps.playlist.outputs.type == 'playlist'
        run: |
          yt-dlp \
            --flat-playlist \
            -x --audio-format mp3 --audio-quality 0 \
            --embed-metadata \
            --no-progress \
            -o "%(id)s_%(title)s.%(ext)s" \
            "${{ inputs.youtube_url }}"
        shell: bash

      - name: Show downloaded files
        run: ls -lh *.mp3 2>/dev/null || echo "No MP3 files found"

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.mp3 2>/dev/null || true
          git add -u 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new files to commit"
          else
            git commit -m "Add music: ${{ inputs.youtube_url }}"
            git push
          fi
